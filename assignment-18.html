<!DOCTYPE html>
<html lang="en">
<head>
    <title>ABC College Admission 2026</title>
    <style>
        body { font-family: Arial; }
        header, footer {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 10px;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main id="main">
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>₹90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>₹45,000</td>
                </tr>
            </tbody>
        </table>

        <form method="post" action="submit.php">
            <fieldset>
                <legend>Application Form</legend>

                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="course">Course:</label><br>
                <select id="course" name="course">
                    <option value="btech">B.Tech CSE</option>
                    <option value="bca">BCA</option>
                </select><br><br>

                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="3" cols="35"></textarea><br><br>

                <input type="submit" value="Apply">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
